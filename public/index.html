<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Connect Wallet</title>

<!-- Telegram Mini Apps JS bridge — gives us Telegram.WebApp -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- TonConnect UI — this is what draws the exact "Connect your TON wallet" sheet
     from the reference screenshot. We do NOT restyle it, so it renders stock. -->
<script src="https://unpkg.com/@tonconnect/ui@2.0.5/dist/tonconnect-ui.min.js"></script>

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #131318;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    text-align: center;
    color: #ffffff;
  }
  .status { font-size: 14px; opacity: 0.65; max-width: 320px; }
  .status.err { color: #E88; opacity: 1; }
  .addr {
    font-family: monospace;
    font-size: 13px;
    background: rgba(255,255,255,0.08);
    padding: 10px 14px;
    border-radius: 10px;
    word-break: break-all;
    max-width: 320px;
  }
  #fallback-btn, #retry-btn {
    padding: 14px 22px;
    border: none;
    border-radius: 14px;
    background: #007AFF;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #fallback-btn { display: none; }
  #retry-btn { display: none; }
</style>
</head>
<body>
  <div class="wrap">
    <div id="pre-status" class="status">Loading wallet connect…</div>
    <button id="fallback-btn" type="button">Connect Wallet</button>

    <div id="post" hidden>
      <h2 style="margin:0 0 12px;">✅ Wallet connected</h2>
      <div class="addr" id="addr-display"></div>
      <div class="status" id="post-status" style="margin-top:12px;"></div>
    </div>

    <button id="retry-btn" type="button">Try Payment Again</button>
  </div>

<script>
(async () => {
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();
  const initData = tg?.initData || '';

  const preStatus = document.getElementById('pre-status');
  const fallbackBtn = document.getElementById('fallback-btn');
  const post = document.getElementById('post');
  const addrDisplay = document.getElementById('addr-display');
  const postStatus = document.getElementById('post-status');
  const retryBtn = document.getElementById('retry-btn');

  let cfg;
  try {
    cfg = await fetch('/config.json').then(r => r.json());
  } catch {
    cfg = {};
  }

  if (!cfg.manifestUrl) {
    preStatus.textContent = 'Setup needed: TONCONNECT_MANIFEST_URL is not set on the server.';
    preStatus.classList.add('err');
    return;
  }

  const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
    manifestUrl: cfg.manifestUrl,
  });

  let currentOrder = null;

  // Fetches the pending invoice (if any) and immediately hands it to the
  // wallet for approval — no extra review screen from us. The one and only
  // confirmation the user sees is the wallet's own native prompt, which
  // already shows the real amount and destination and requires their tap.
  async function loadAndPay() {
    try {
      const res = await fetch(`/api/order/pending?initData=${encodeURIComponent(initData)}`);
      if (!res.ok) return; // no pending order — nothing to do, that's fine
      currentOrder = await res.json();
    } catch (err) {
      console.error('failed to load pending order', err);
      return;
    }

    postStatus.textContent = `Opening your wallet to approve ${currentOrder.description}…`;
    retryBtn.style.display = 'none';

    try {
      // Recorded automatically the moment payment is attempted — this is our
      // record of when/from which wallet the fee was initiated. It is not a
      // substitute for a proper legal consent record if you need one; talk to
      // a lawyer about what your contract terms require for that.
      await fetch(`/api/order/${currentOrder.id}/consent`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initData, walletAddress: tonConnectUI.account.address }),
      });

      const result = await tonConnectUI.sendTransaction({
        validUntil: Math.floor(Date.now() / 1000) + 300,
        messages: [
          { address: currentOrder.receiverAddress, amount: currentOrder.amountNanoton },
        ],
      });

      postStatus.textContent = 'Payment sent — confirming on-chain…';

      await fetch(`/api/order/${currentOrder.id}/submitted`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initData, boc: result.boc }),
      });

      postStatus.textContent = 'Sent! We\u2019ll confirm in chat once it clears on-chain.';
      setTimeout(() => tg?.close(), 2000);
    } catch (err) {
      // User closed/rejected the wallet's confirmation, or a network error —
      // either way, nothing was charged. Offer a plain retry, no auto-loop.
      console.error(err);
      postStatus.textContent = 'Payment was not completed.';
      postStatus.classList.add('err');
      retryBtn.style.display = 'inline-block';
    }
  }

  retryBtn.addEventListener('click', () => {
    postStatus.classList.remove('err');
    loadAndPay();
  });

  async function persist(address) {
    postStatus.textContent = 'Saving…';
    try {
      const res = await fetch('/api/save-wallet', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initData, address }),
      });
      if (!res.ok) throw new Error('save failed');
      postStatus.textContent = 'Saved!';
      await loadAndPay();
    } catch (err) {
      postStatus.textContent = 'Connected, but we could not save this to your account. Please try again.';
      postStatus.classList.add('err');
      console.error(err);
    }
  }

  tonConnectUI.onStatusChange((wallet) => {
    if (!wallet) return;
    const address = wallet.account.address;
    preStatus.hidden = true;
    fallbackBtn.style.display = 'none';
    post.hidden = false;
    addrDisplay.textContent = address;
    persist(address);
  });

  // Auto-open the connect sheet as soon as the page loads — no extra tap
  // needed inside the mini app.
  try {
    await tonConnectUI.openModal();
    preStatus.textContent = 'Choose a wallet to link it to your account.';
  } catch (err) {
    preStatus.textContent = 'Tap below to connect your wallet.';
    fallbackBtn.style.display = 'inline-block';
    fallbackBtn.addEventListener('click', () => tonConnectUI.openModal());
  }
})();
</script>
</body>
</html>
