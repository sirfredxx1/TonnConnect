<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Connect Wallet</title>

<!-- Telegram Mini Apps JS bridge — gives us Telegram.WebApp -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- TonConnect UI — this is what draws the exact "Connect your TON wallet" sheet
     from the reference screenshot. We do NOT restyle it, so it renders stock. -->
<script src="https://unpkg.com/@tonconnect/ui@2.0.5/dist/tonconnect-ui.min.js"></script>

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #131318;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    text-align: center;
    color: #ffffff;
  }
  .status { font-size: 14px; opacity: 0.65; max-width: 320px; }
  .status.err { color: #E88; opacity: 1; }
  .addr {
    font-family: monospace;
    font-size: 13px;
    background: rgba(255,255,255,0.08);
    padding: 10px 14px;
    border-radius: 10px;
    word-break: break-all;
    max-width: 320px;
  }
  #fallback-btn {
    display: none;
    padding: 14px 22px;
    border: none;
    border-radius: 14px;
    background: #007AFF;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .card {
    background: rgba(255,255,255,0.06);
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 340px;
    text-align: left;
  }
  .card h3 { margin: 0 0 12px; font-size: 16px; }
  .card .amount { font-size: 26px; font-weight: 700; margin: 8px 0; }
  .card .desc { font-size: 14px; opacity: 0.8; margin-bottom: 16px; }
  .card .to { font-size: 12px; opacity: 0.55; font-family: monospace; word-break: break-all; margin-bottom: 16px; }
  .consent-row { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 18px; font-size: 13px; opacity: 0.9; }
  .consent-row input { margin-top: 3px; flex-shrink: 0; }
  #pay-btn {
    width: 100%;
    padding: 14px 22px;
    border: none;
    border-radius: 14px;
    background: #007AFF;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #pay-btn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="wrap">
    <div id="pre-status" class="status">Loading wallet connect…</div>
    <button id="fallback-btn" type="button">Connect Wallet</button>

    <div id="post" hidden>
      <h2 style="margin:0 0 12px;">✅ Wallet connected</h2>
      <div class="addr" id="addr-display"></div>
      <div class="status" id="post-status" style="margin-top:12px;"></div>
    </div>

    <div id="order-card" class="card" hidden>
      <h3>Contract signing fee</h3>
      <div class="desc" id="order-desc"></div>
      <div class="amount" id="order-amount"></div>
      <div class="to" id="order-to"></div>
      <label class="consent-row">
        <input type="checkbox" id="consent-check" />
        <span>I have reviewed the contract and agree to pay this signing fee from the wallet connected above.</span>
      </label>
      <button id="pay-btn" type="button" disabled>Sign &amp; Pay</button>
      <div class="status" id="order-status" style="margin-top:12px;"></div>
    </div>
  </div>

<script>
(async () => {
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();
  const initData = tg?.initData || '';

  const preStatus = document.getElementById('pre-status');
  const fallbackBtn = document.getElementById('fallback-btn');
  const post = document.getElementById('post');
  const addrDisplay = document.getElementById('addr-display');
  const postStatus = document.getElementById('post-status');

  const orderCard = document.getElementById('order-card');
  const orderDesc = document.getElementById('order-desc');
  const orderAmount = document.getElementById('order-amount');
  const orderTo = document.getElementById('order-to');
  const consentCheck = document.getElementById('consent-check');
  const payBtn = document.getElementById('pay-btn');
  const orderStatus = document.getElementById('order-status');

  let cfg;
  try {
    cfg = await fetch('/config.json').then(r => r.json());
  } catch {
    cfg = {};
  }

  if (!cfg.manifestUrl) {
    preStatus.textContent = 'Setup needed: TONCONNECT_MANIFEST_URL is not set on the server.';
    preStatus.classList.add('err');
    return;
  }

  const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
    manifestUrl: cfg.manifestUrl,
  });

  function nanotonToTon(nanoton) {
    // String-based division to avoid float precision loss on large values.
    const s = String(nanoton).padStart(10, '0');
    const whole = s.slice(0, -9).replace(/^0+(?=\d)/, '');
    const frac = s.slice(-9).replace(/0+$/, '');
    return frac ? `${whole}.${frac}` : whole;
  }

  let currentOrder = null;

  async function loadPendingOrder() {
    try {
      const res = await fetch(`/api/order/pending?initData=${encodeURIComponent(initData)}`);
      if (!res.ok) return; // no pending order — nothing to show, that's fine
      currentOrder = await res.json();
      orderDesc.textContent = currentOrder.description;
      orderAmount.textContent = `${nanotonToTon(currentOrder.amountNanoton)} TON`;
      orderTo.textContent = `To: ${currentOrder.receiverAddress}`;
      orderCard.hidden = false;
    } catch (err) {
      console.error('failed to load pending order', err);
    }
  }

  consentCheck.addEventListener('change', () => {
    payBtn.disabled = !consentCheck.checked;
  });

  payBtn.addEventListener('click', async () => {
    if (!currentOrder || !tonConnectUI.account) return;
    payBtn.disabled = true;
    orderStatus.classList.remove('err');
    orderStatus.textContent = 'Recording your agreement…';

    try {
      const consentRes = await fetch(`/api/order/${currentOrder.id}/consent`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initData, walletAddress: tonConnectUI.account.address }),
      });
      if (!consentRes.ok) throw new Error('consent_failed');

      orderStatus.textContent = 'Confirm the payment in your wallet…';

      // This is the real point of no accidental action: the wallet itself
      // shows the user the exact amount and destination and requires their
      // explicit approval. Nothing here can bypass that.
      const result = await tonConnectUI.sendTransaction({
        validUntil: Math.floor(Date.now() / 1000) + 300,
        messages: [
          { address: currentOrder.receiverAddress, amount: currentOrder.amountNanoton },
        ],
      });

      orderStatus.textContent = 'Payment sent — confirming on-chain…';

      await fetch(`/api/order/${currentOrder.id}/submitted`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initData, boc: result.boc }),
      });

      orderStatus.textContent = 'Sent! We\u2019ll confirm in chat once it clears on-chain.';
      setTimeout(() => tg?.close(), 2000);
    } catch (err) {
      console.error(err);
      orderStatus.textContent = 'Payment was not completed. You can try again.';
      orderStatus.classList.add('err');
      payBtn.disabled = false;
    }
  });

  async function persist(address) {
    postStatus.textContent = 'Saving…';
    try {
      const res = await fetch('/api/save-wallet', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initData, address }),
      });
      if (!res.ok) throw new Error('save failed');
      postStatus.textContent = 'Saved!';
      await loadPendingOrder();
    } catch (err) {
      postStatus.textContent = 'Connected, but we could not save this to your account. Please try again.';
      postStatus.classList.add('err');
      console.error(err);
    }
  }

  tonConnectUI.onStatusChange((wallet) => {
    if (!wallet) return;
    const address = wallet.account.address;
    preStatus.hidden = true;
    fallbackBtn.style.display = 'none';
    post.hidden = false;
    addrDisplay.textContent = address;
    persist(address);
  });

  // Auto-open the connect sheet as soon as the page loads, same as tapping
  // "Connect Wallet" in the screenshot — no extra tap needed inside the mini app.
  try {
    await tonConnectUI.openModal();
    preStatus.textContent = 'Choose a wallet to link it to your account.';
  } catch (err) {
    preStatus.textContent = 'Tap below to connect your wallet.';
    fallbackBtn.style.display = 'inline-block';
    fallbackBtn.addEventListener('click', () => tonConnectUI.openModal());
  }
})();
</script>
</body>
</html>
