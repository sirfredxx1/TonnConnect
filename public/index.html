<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Connect Wallet</title>

<!-- Telegram Mini Apps JS bridge — gives us Telegram.WebApp -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- TonConnect UI — this is what draws the "Connect your TON wallet" sheet -->
<script src="https://unpkg.com/@tonconnect/ui@2.0.5/dist/tonconnect-ui.min.js"></script>

<style>
  :root { color-scheme: light dark; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #17212b);
    color: var(--tg-theme-text-color, #ffffff);
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px;
    box-sizing: border-box;
    text-align: center;
  }
  .status {
    font-size: 15px;
    opacity: 0.75;
    max-width: 320px;
  }
  .addr {
    font-family: monospace;
    font-size: 13px;
    background: rgba(127,127,127,0.15);
    padding: 10px 14px;
    border-radius: 10px;
    word-break: break-all;
  }
  #ton-connect-button { margin-top: 4px; }
</style>
</head>
<body>
  <div class="wrap">
    <h2>Connect your TON wallet</h2>
    <div id="ton-connect-button"></div>
    <div id="status" class="status">Choose a wallet to link it to your account.</div>
  </div>

<script>
(async () => {
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const statusEl = document.getElementById('status');

  // MANIFEST_URL is injected by the server at /public/config.js — see server.js
  const cfg = await fetch('/config.json').then(r => r.json());

  const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
    manifestUrl: cfg.manifestUrl,
    buttonRootId: 'ton-connect-button',
  });

  // Fires once when a wallet connects, and again on page load if already connected.
  tonConnectUI.onStatusChange(async (wallet) => {
    if (!wallet) return;

    const address = wallet.account.address;
    statusEl.textContent = 'Connected — saving…';

    try {
      const res = await fetch('/api/save-wallet', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          initData: tg?.initData || '',
          address,
        }),
      });

      if (!res.ok) throw new Error('save failed');

      document.querySelector('.wrap').innerHTML = `
        <h2>✅ Wallet connected</h2>
        <div class="addr">${address}</div>
      `;

      // Give the user a beat to see the confirmation, then close the mini app
      // and let them return to the chat, where the bot also sends a message.
      setTimeout(() => tg?.close(), 1200);
    } catch (err) {
      statusEl.textContent = 'Connected, but we could not save this to your account. Please try again.';
      console.error(err);
    }
  });
})();
</script>
</body>
</html>
